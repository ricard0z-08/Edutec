<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoClima — Esqueci minha senha</title>
<meta name="description" content="Receba um link para criar uma nova senha no EcoClima.">
<link rel="icon" href="imagens/Logo-preto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&family=DM+Sans:opsz,wght@9..40,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="eco-corpo">

<main class="auth">

  <div class="auth__forma">
    <a class="auth__logo" href="home.html" aria-label="EcoClima — ir para a Home">
      <img src="imagens/Logo-preto.png" alt="EcoClima">
    </a>

    <div class="auth__conteudo">
      <h1 class="auth__titulo" id="tituloEsqueci">Esqueceu sua senha?</h1>
      <p class="auth__texto" id="textoEsqueci">
        Digite seu e-mail e enviaremos um link para criar uma nova.
      </p>

      <form class="auth__form" id="formEsqueci" novalidate>
        <div class="eco-campo" data-campo="email">
          <label class="eco-campo__rotulo" for="email">E-mail</label>
          <input class="eco-campo__entrada" id="email" name="email" type="email"
                 autocomplete="email" aria-describedby="erro-email">
          <p class="eco-campo__erro" id="erro-email" aria-live="polite"></p>
        </div>

        <button class="eco-btn eco-btn--principal auth__enviar" id="enviarEsqueci" type="submit">
          <span data-rotulo>Enviar link</span>
        </button>
      </form>

      <!-- aparece no lugar do formulário depois do envio -->
      <div class="auth__enviado" id="enviado" hidden>
        <!-- tabindex="-1" só para o JS poder mandar o foco para cá
             depois do envio; o Tab não para neste parágrafo -->
        <p class="auth__enviado-texto" id="enviadoTexto" tabindex="-1"></p>
        <button class="eco-btn eco-btn--secundario" id="reenviar" type="button">Reenviar link</button>
        <a class="auth__link-menor" href="login.html">Voltar para o login</a>
      </div>
    </div>
  </div>

  <div class="auth__midia auth__midia--foto"></div>
</main>

<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
