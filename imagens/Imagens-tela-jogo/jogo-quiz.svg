<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Ilustracao do planeta Terra visto do espaco, com tres cartas de resposta flutuando ao redor">
<title>Ilustracao do planeta Terra visto do espaco, com tres cartas de resposta flutuando ao redor</title>
<defs>
<linearGradient id="espaco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1428"/><stop offset="0.6" stop-color="#14203A"/><stop offset="1" stop-color="#1D2E45"/></linearGradient>
<linearGradient id="planeta" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#3E7FA6"/><stop offset="1" stop-color="#22506E"/></linearGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0.62" stop-color="#9FD0E0" stop-opacity="0"/><stop offset="0.86" stop-color="#9FD0E0" stop-opacity="0.32"/><stop offset="1" stop-color="#9FD0E0" stop-opacity="0"/></radialGradient>
<linearGradient id="veu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1ECE2" stop-opacity="0.1"/><stop offset="0.5" stop-color="#F1ECE2" stop-opacity="0.02"/><stop offset="1" stop-color="#1A2014" stop-opacity="0.14"/></linearGradient>
</defs>

<rect width="1000" height="750" fill="url(#espaco)"/>

<!-- estrelas -->
<g fill="#F2F0E6">
  <circle cx="86" cy="92" r="2.4" opacity=".8"/><circle cx="178" cy="188" r="1.6" opacity=".55"/>
  <circle cx="262" cy="76" r="2" opacity=".7"/><circle cx="372" cy="148" r="1.4" opacity=".45"/>
  <circle cx="128" cy="318" r="1.8" opacity=".6"/><circle cx="62" cy="452" r="2.2" opacity=".7"/>
  <circle cx="214" cy="560" r="1.5" opacity=".5"/><circle cx="96" cy="648" r="2" opacity=".65"/>
  <circle cx="332" cy="672" r="1.6" opacity=".5"/><circle cx="640" cy="84" r="2.2" opacity=".75"/>
  <circle cx="742" cy="176" r="1.5" opacity=".5"/><circle cx="856" cy="112" r="2.4" opacity=".8"/>
  <circle cx="932" cy="252" r="1.7" opacity=".55"/><circle cx="880" cy="418" r="2" opacity=".65"/>
  <circle cx="946" cy="560" r="1.6" opacity=".5"/><circle cx="806" cy="642" r="2.2" opacity=".7"/>
  <circle cx="690" cy="700" r="1.5" opacity=".45"/><circle cx="520" cy="60" r="1.8" opacity=".6"/>
</g>

<!-- orbita -->
<ellipse cx="500" cy="390" rx="336" ry="126" fill="none" stroke="#9FD0E0" stroke-width="2" opacity=".28"/>

<!-- planeta -->
<circle cx="500" cy="390" r="252" fill="url(#halo)"/>
<circle cx="500" cy="390" r="212" fill="url(#planeta)"/>
<g fill="#4E8C55">
  <path d="M356,300 q52,-46 118,-30 q56,14 44,58 q-12,44 -78,54 q-72,10 -96,-22 q-20,-28 12,-60 Z"/>
  <path d="M520,414 q74,-30 122,4 q40,26 10,68 q-32,44 -96,36 q-60,-8 -60,-54 q0,-34 24,-54 Z"/>
  <path d="M402,470 q44,-8 58,22 q12,26 -18,44 q-34,20 -62,-4 q-24,-22 -4,-46 q10,-12 26,-16 Z"/>
</g>
<!-- nuvens -->
<g fill="#F2F6F7" opacity=".28">
  <ellipse cx="430" cy="268" rx="96" ry="24"/>
  <ellipse cx="596" cy="352" rx="74" ry="19"/>
  <ellipse cx="470" cy="540" rx="88" ry="22"/>
</g>
<!-- brilho da atmosfera -->
<path d="M500,178 a212,212 0 0,0 -196,132 a212,212 0 0,1 196,-132 Z" fill="#CFE7F0" opacity=".2"/>

<!-- cartas de resposta flutuando -->
<g>
  <rect x="118" y="196" width="152" height="96" rx="18" fill="#F1ECE2" transform="rotate(-9 194 244)"/>
  <path d="M146 232 h96 M146 256 h64" stroke="#A9B2A4" stroke-width="8" stroke-linecap="round" transform="rotate(-9 194 244)"/>

  <rect x="736" y="150" width="152" height="96" rx="18" fill="#F1ECE2" transform="rotate(7 812 198)"/>
  <path d="M764 186 h96 M764 210 h72" stroke="#A9B2A4" stroke-width="8" stroke-linecap="round" transform="rotate(7 812 198)"/>

  <!-- a carta certa: verde, com o visto -->
  <rect x="700" y="512" width="168" height="106" rx="20" fill="#2F6B1F" transform="rotate(-6 784 565)"/>
  <path d="M748 566 l24 26 l50 -56" fill="none" stroke="#EAF3E4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 784 565)"/>
</g>

<rect width="1000" height="750" fill="url(#veu)"/>
</svg>
