<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Ilustracao de tres lixeiras de coleta seletiva lado a lado, com embalagens caindo dentro delas">
<title>Ilustracao de tres lixeiras de coleta seletiva lado a lado, com embalagens caindo dentro delas</title>
<defs>
<linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4EFD9"/><stop offset="0.55" stop-color="#D3EBC8"/><stop offset="1" stop-color="#C2DDB6"/></linearGradient>
<linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FB07A"/><stop offset="1" stop-color="#6A8C58"/></linearGradient>
<linearGradient id="veu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1ECE2" stop-opacity="0.12"/><stop offset="0.5" stop-color="#F1ECE2" stop-opacity="0.02"/><stop offset="1" stop-color="#1A2014" stop-opacity="0.12"/></linearGradient>
</defs>

<rect width="1000" height="750" fill="url(#ceu)"/>
<circle cx="820" cy="150" r="70" fill="#F7EED9" opacity=".9"/>

<!--mata rasteira ao fundo-->
<path d="M0,470 C140,452 200,468 320,458 C440,448 520,466 640,456 C760,446 860,464 1000,452 L1000,750 L0,750 Z" fill="#7A9A68" opacity=".55"/>
<path d="M0,520 C160,506 240,522 380,512 C520,502 620,520 760,510 C880,502 940,516 1000,510 L1000,750 L0,750 Z" fill="url(#chao)"/>

<!--arvores simples do fundo-->
<g fill="#4E7148">
  <path d="M96,470 q-34,-14 -34,-48 q0,-40 34,-52 q34,12 34,52 q0,34 -34,48 Z"/>
  <rect x="90" y="462" width="12" height="42" rx="5"/>
  <path d="M906,476 q-30,-12 -30,-42 q0,-36 30,-46 q30,10 30,46 q0,30 -30,42 Z"/>
  <rect x="900" y="468" width="12" height="40" rx="5"/>
</g>

<!--embalagens caindo: cada uma na cor da sua lixeira-->
<g opacity=".95">
  <rect x="243" y="196" width="74" height="58" rx="6" fill="#F4EFE2" transform="rotate(-16 280 225)"/>
  <path d="M250 216 h56 M250 232 h42" stroke="#B9B096" stroke-width="5" stroke-linecap="round" transform="rotate(-16 280 225)"/>

  <path d="M492 186 q-14,0 -14,14 v14 q-16,10 -16,32 v44 q0,14 14,14 h32 q14,0 14,-14 v-44 q0,-22 -16,-32 v-14 q0,-14 -14,-14 Z" fill="#CFE6EA" transform="rotate(12 500 220)"/>

  <rect x="676" y="192" width="52" height="72" rx="10" fill="#E2A98C" transform="rotate(-10 702 228)"/>
  <rect x="690" y="180" width="24" height="16" rx="5" fill="#C98B6C" transform="rotate(-10 702 228)"/>
</g>

<!--lixeiras-->
<!--azul: papel-->
<g>
  <ellipse cx="280" cy="612" rx="112" ry="18" fill="#3F5C36" opacity=".2"/>
  <path d="M204,398 h152 l-18,212 h-116 Z" fill="#3C6E8F"/>
  <path d="M204,398 h48 l-14,212 h-34 Z" fill="#4E82A4" opacity=".65"/>
  <rect x="190" y="372" width="180" height="34" rx="12" fill="#2F5A77"/>
  <rect x="256" y="356" width="48" height="18" rx="8" fill="#2F5A77"/>
  <path d="M262,452 l36,-22 36,22 -36,22 Z" fill="#EAF2F6" opacity=".85"/>
</g>

<!--verde: vidro-->
<g>
  <ellipse cx="500" cy="622" rx="118" ry="19" fill="#3F5C36" opacity=".2"/>
  <path d="M420,392 h160 l-19,228 h-122 Z" fill="#3E7A45"/>
  <path d="M420,392 h50 l-15,228 h-35 Z" fill="#519358" opacity=".65"/>
  <rect x="405" y="364" width="190" height="36" rx="13" fill="#2F6236"/>
  <rect x="476" y="347" width="48" height="19" rx="8" fill="#2F6236"/>
  <path d="M482,450 l36,-22 36,22 -36,22 Z" fill="#EAF2F6" opacity=".85"/>
</g>

<!--vermelho: plastico-->
<g>
  <ellipse cx="716" cy="612" rx="112" ry="18" fill="#3F5C36" opacity=".2"/>
  <path d="M640,398 h152 l-18,212 h-116 Z" fill="#B04430"/>
  <path d="M640,398 h48 l-14,212 h-34 Z" fill="#C6573F" opacity=".65"/>
  <rect x="626" y="372" width="180" height="34" rx="12" fill="#93331F"/>
  <rect x="692" y="356" width="48" height="18" rx="8" fill="#93331F"/>
  <path d="M698,452 l36,-22 36,22 -36,22 Z" fill="#F4EEE6" opacity=".85"/>
</g>

<rect width="1000" height="750" fill="url(#veu)"/>
</svg>
